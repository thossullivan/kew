  #     github.event_name == 'pull_request_review' &&
  #     github.event.review.state == 'changes_requested'
  #   runs-on: self-hosted
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Address review
  #       run: kew review ...
