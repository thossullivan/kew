# Internal working material must not reach the published site. `not_in_nav`
# only suppressed the "not in nav" build warnings — the pages were still built,
# deployed, and sitemap-indexed on kew.dev/docs and gh-pages (found 2026-08-06:
# ~214 internal pages live, including vulnerability-naming audit packs).
# `exclude_docs` removes them from the build entirely; nothing listed here may
# move back to `not_in_nav`.
#
# This list is short because internal material no longer lives under `docs/`.
# The E01 curation (2026-08-26, PR #1701) deleted six internal trees —
# superpowers, launch-surface, plans, spikes, handoff, receipts. The launch cut
# (2026-09-22) moved the held audit packs and every design page off the
# owner-approved allowlist of ten to the private docs archive. `docs/design/`
# now holds only those ten public design records, and they build as public
# pages. The guarantee the removed entries provided is not lost:
# `scripts/check-docs.sh` refuses the deleted prefixes under `docs/` and any
# design page off its allowlist, which is stronger than excluding them from a
# build they can no longer enter. `/audit/**` stays excluded as well: the
# documented deploy runs a plain `mkdocs build`, which never runs that
# script, so an untracked audit pack in an operator's tree must still not
# build.
exclude_docs: |
  /audit/**
  /vhs/**
  /brand-guidelines.md

# mkdocs 1.6 reports a link to a missing `#anchor` at INFO by default, so a
# broken fragment built clean. At `warn`, `mkdocs build --strict` (the docs
# gate in scripts/check-docs.sh) fails on one (#1909).
validation:
  anchors: warn

markdown_extensions:
  - tables
  # Explicit heading ids (`## [sandbox] {#sandbox}`) in configuration.md and
  # how-it-works.md need attr_list; without it the `{#id}` text became part
  # of the heading and its slug (`sandbox-sandbox`), so inbound links broke.
  - attr_list
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
