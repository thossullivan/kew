site_name: kew
# Docs are served under /docs/ on the launch host: `npm run dist` in www/ puts
# the built site at build/docs/, and www/Caddyfile serves that tree as it is,
# with no prefix stripping. Canonical URLs and the generated sitemap both
# derive from this, so it has to match where the docs actually are.
site_url: https://kew.dev/docs/
site_description: The open-source control plane for autonomous coding agents
# No `repo_url`/`repo_name`: Material turns them into a source widget that
# calls the GitHub API from every page, which the site CSP (www/Caddyfile)
# blocks, and the public repository name is not settled yet.

theme:
  name: material
  # One dark scheme, no toggle. `custom` primary and accent stop Material's
  # stock indigo rules from overriding the palette in stylesheets/extra.css,
  # which follows DESIGN.md's tokens.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  # The kew mark (a byte copy of www/static/favicon.svg). It is the favicon;
  # extra.css hides it in the header and drawer, which show the wordmark, so
  # `logo` only replaces Material's book icon should that CSS not load.
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  # `font: false` stops Material requesting Google Fonts. The site serves
  # IBM Plex itself: docs/assets/fonts holds a byte copy of the fonts kew already
  # vendors (kew/src/kew/assets/fonts), and the @font-face rules live in
  # stylesheets/extra.css. scripts/check-docs.sh fails on any built page that
  # loads an off-origin resource.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

# The stock footer becomes one hairline row: no "Made with Material".
copyright: 'kew · <a href="https://github.com/thossullivan/kew">GitHub</a> · <a href="https://kew.dev/">kew.dev</a>'
extra:
  generator: false

# Each docs file appears once. kew/tests/test_docs_nav_lists_every_page_once.py
# fails on a duplicate, and on a page under docs/ that is neither here nor
# matched by `exclude_docs`.
nav:
  - Start:
    - Intro: index.md
    - Getting Started: getting-started.md
    - How It Works: how-it-works.md
    - How a Change Is Proven: proof.md
    - Glossary: glossary.md
  - Security:
