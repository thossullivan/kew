name: Runner Canary

# Live runner-compatibility canary (#265). Self-hosted: the runner CLIs it
# exercises (claude, opencode) are installed and authenticated on that
# machine, which is the only configuration that attests BOTH runners. A hosted
# box can only attest claude (see docs/cli/canary.md), so falling back there
# would quietly halve the canary's coverage rather than fail. The job runs only
# while this repository is private and is skipped in any other; its runner
# expression resolves to `ubuntu-latest` unless the repository is private.
# Schedule + workflow_dispatch only — never reachable from a PR.

on:
  schedule:
    - cron: "0 7 * * *"   # nightly, after the 06:00 weekly-audit slot
  workflow_dispatch:

jobs:
  visibility:
    # A schedule event's payload carries no repository object, so
    # github.event.repository.visibility is empty on a scheduled run. Read the
    # repository's visibility from the API instead. Hosted, checks out
    # nothing, and runs no repository code. A failed read fails this job, and
    # the host job that needs it does not run.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      visibility: ${{ steps.read.outputs.visibility }}
    steps:
      - name: Read repository visibility
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          echo "visibility=${visibility}" >> "$GITHUB_OUTPUT"

  canary:
    needs: visibility
    if: needs.visibility.outputs.visibility == 'private'
    runs-on: ${{ needs.visibility.outputs.visibility == 'private' && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    env:
      UV_PYTHON: "3.13"
    steps:
      # Runner boundary (F1). First step, before any checkout: it runs no
      # repository code. Refuses a runner that is not GitHub-hosted unless the
      # repository is private; an empty or unknown value fails closed.
      - name: Runner boundary — self-hosted requires a private repository
        if: runner.environment != 'github-hosted' && needs.visibility.outputs.visibility != 'private'
        env:
          BOUNDARY_RUNNER: ${{ runner.environment }}
          BOUNDARY_VISIBILITY: ${{ needs.visibility.outputs.visibility }}
        run: |
          echo "::error::This job landed on a '$BOUNDARY_RUNNER' runner in a '$BOUNDARY_VISIBILITY' repository. Only a private repository may use the self-hosted runner. Unregister the runner from this repository."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Don't leave the job's git token in .git/config — the third-party
          # claude/opencode CLIs run later and shouldn't see repo auth.
          persist-credentials: false
      # Shared-clone heal (see ci.yml). This job has always run self-hosted,
      # so it has always been exposed to a leftover non-cone sparse checkout
      # pruning the clone out from under it — it simply had not hit one yet.
      - name: Preflight — ensure kew/ checkout layout
        shell: bash
        run: |
          git sparse-checkout disable 2>/dev/null || true
          git config --unset core.sparseCheckout 2>/dev/null || true
          git checkout -f HEAD 2>/dev/null || true
          if [ ! -f kew/pyproject.toml ]; then
            echo "::error::kew/ package directory missing from checkout at $PWD."
            echo "::error::The self-hosted runner's shared clone is in a bad state (likely a leftover sparse checkout from an earlier workflow)."
            echo "::error::Runner-host fix: delete _work/kew on the runner to force a fresh clone."
            exit 1
          fi
          echo "Checkout layout OK: kew/ present at $PWD/kew"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-local-path: ${{ runner.temp }}/kew-uv-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install kew
        working-directory: kew
        run: uv sync

      - name: Install claude CLI (skip if already present, e.g. self-hosted)
        run: command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code

      # The claude CLI auths via CLAUDE_CODE_OAUTH_TOKEN, which lives in an
      # env file in the runner user's kew config directory (deliberately
      # NOT in shell profiles or repo secrets). Actions jobs don't run login
      # shells, so load it explicitly; without it the claude leg reports
      # "Not logged in" and the canary false-alarms as drift (#1139).
      # github-hosted fallback still auths via the ANTHROPIC_API_KEY secret.
      - name: Load agent token (self-hosted)
        run: |
          if [ -f "$HOME/.config/kew/agent-token.env" ]; then
            . "$HOME/.config/kew/agent-token.env"
            if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
              echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
              echo "CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN" >> "$GITHUB_ENV"
            fi
          fi

      - name: Run live canary
        working-directory: kew
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The decision is made from canary.json's exit_code (below), NOT this
        # step's shell status — an internal crash also exits non-zero and must
        # not be misread as vendor drift. `|| true` keeps the step green here.
        run: |
          uv run kew canary --runner claude-code --runner opencode --json > canary.json || true
          cat canary.json

      - name: Run Codex canary
        working-directory: kew
        env: &codex-empty-env
          KEW_CODEX_CANARY_MODEL: ${{ vars.KEW_CODEX_CANARY_MODEL }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_AUTH_TOKEN: ""
          CLAUDE_CODE_OAUTH_TOKEN: ""
          OPENAI_API_KEY: ""
          CODEX_ACCESS_TOKEN: ""
          OPENROUTER_API_KEY: ""
          GOOGLE_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_APPLICATION_CREDENTIALS: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          AWS_SECURITY_TOKEN: ""
          AWS_WEB_IDENTITY_TOKEN_FILE: ""
          AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ""
          AWS_CONTAINER_CREDENTIALS_FULL_URI: ""
        run: |
          if [ -z "$KEW_CODEX_CANARY_MODEL" ]; then
            printf '%s\n' '{"exit_code":2,"runners":[{"runner":"codex","status":"skip","reason":"KEW_CODEX_CANARY_MODEL is empty","checks":[]}]}' > codex.json
          else
            uv run kew canary --runner codex --model "$KEW_CODEX_CANARY_MODEL" --json > codex.json || true
          fi
          cat codex.json

      - name: Run Codex resume canary
        working-directory: kew
        env: *codex-empty-env
        run: |
          if [ -z "$KEW_CODEX_CANARY_MODEL" ]; then
            printf '%s\n' '{"exit_code":2,"runners":[{"runner":"codex","status":"skip","reason":"KEW_CODEX_CANARY_MODEL is empty","checks":[]}]}' > codex-resume.json
          else
            uv run kew canary --runner codex --exercise-resume --model "$KEW_CODEX_CANARY_MODEL" --json > codex-resume.json || true
          fi
          cat codex-resume.json

      - name: Evaluate canary report
        id: eval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const paths = ['kew/canary.json', 'kew/codex.json', 'kew/codex-resume.json'];
            const reports = paths.map(path => {
              try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch (e) { return null; }
            });
            // Missing/invalid JSON or no numeric exit_code => INTERNAL workflow
            // failure, not vendor drift. Fail loudly, but don't file a drift issue.
            if (reports.some(report => !report || typeof report.exit_code !== 'number')) {
              core.setOutput('outcome', 'internal');
              core.error('canary produced no valid JSON report — internal failure, not drift');
              return;
            }
            const exitCodes = reports.map(report => report.exit_code);
            const runners = reports.flatMap(report => report.runners || []);
            if (!exitCodes.includes(1)) {
              // Drift 1 outranks incomplete 2, which outranks success 0.
              core.setOutput('outcome', exitCodes.includes(2) ? 'incomplete' : 'ok');
              return;
            }
            core.setOutput('outcome', 'drift');
            const broken = runners
              .filter(r => r.status === 'fail')
              .map(r => {
                const fails = (r.checks || []).filter(c => c.status === 'fail')
                  .map(c => `- ${c.name}: ${c.summary}`).join('\n');
                return `### ${r.runner}\n${fails}`;
              }).join('\n\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'canary: runner governance drift detected';
            const body = `The nightly runner canary detected drift — kew can no longer correctly read a vendor CLI's governance fields.\n\n${broken}\n\n[Workflow run](${runUrl})`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'canary',
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['canary'], body,
              });
            }

      - name: Fail the job on drift or internal error
        if: steps.eval.outputs.outcome == 'drift' || steps.eval.outputs.outcome == 'internal'
        run: exit 1
