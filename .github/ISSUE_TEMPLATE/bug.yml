name: 🐛 Bug report
description: Report something that doesn't work as documented.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities do not belong here** — report them privately via
        [GitHub Security Advisories](https://github.com/thossullivan/kew/security/advisories/new)
        (see SECURITY.md), not a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you observe? Include the exact error output if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: "`kew --version`, OS, Python version, and which runner (claude-code / opencode / pi / aider)."
      placeholder: |
        kew: 0.x.y
        OS: macOS 15 / Ubuntu 24.04
        Python: 3.13.x
        runner: claude-code
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done (optional)
      description: What would a correct fix look like? Concrete criteria make the fix dispatchable by kew.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
